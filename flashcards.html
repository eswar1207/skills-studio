<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcard Builder</title>
<style>body{font-family:system-ui,Arial;margin:0;background:#f5f3ff;color:#1e1b3a}header{background:#4c3bcf;color:#fff;padding:16px 22px}main{max-width:820px;margin:auto;padding:18px}
.tabs button,.btn{background:#fff;border:1px solid #c9c2f5;border-radius:20px;padding:8px 16px;margin:3px;cursor:pointer;font-size:15px}.tabs button.on{background:#4c3bcf;color:#fff}.btn.p{background:#4c3bcf;color:#fff;border:0}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px #0001;padding:22px;margin:14px 0}.flash{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer}
textarea{width:100%;min-height:180px;font:14px ui-monospace,monospace;box-sizing:border-box;padding:10px}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:10px}.ok{background:#d8f5e3!important}.bad{background:#fde0e0!important}small{color:#6b668f}</style></head><body>
<header><h1 style="margin:0;font-size:24px">Flashcard Builder</h1><small style="color:#ddd">Paste course notes, get a deck. Study mode brings back the cards you miss; quiz mode checks you.</small></header>
<main><div class="tabs" id="tabs"></div><div id="view"></div></main>
<script>
// Notes format: one card per line, "question :: answer". Lines without "::" are skipped.
const SAMPLE=`What does the CAP theorem say? :: During a network partition, a distributed system must choose between consistency and availability.
What is eventual consistency? :: If no new updates arrive, all replicas eventually converge to the same value. Reads in the meantime can be stale.
What is linearizability? :: Every operation appears to take effect at one instant between its start and its end, so a read always sees the latest completed write.
With N replicas, when do quorum reads see the latest write? :: When R + W > N, so every read quorum overlaps every write quorum.
When is a log entry committed in Raft? :: When the leader has replicated it on a majority of servers.
Why does Raft use randomized election timeouts? :: So that followers rarely time out together, which avoids repeated split votes.
What is the weakness of two-phase commit? :: It blocks: if the coordinator fails after participants vote yes, they must wait and cannot decide alone.
What can vector clocks detect that Lamport clocks cannot? :: Whether two events are concurrent. Lamport timestamps give an order consistent with causality but cannot tell concurrency apart.
Why make operations idempotent? :: Applying an idempotent operation twice has the same effect as once, so retries after a timeout are safe.
What does consistent hashing buy you? :: Adding or removing a node only moves about 1/N of the keys instead of reshuffling almost everything.
What is split brain? :: Two nodes both believe they are the leader, usually after a partition. Majority quorums and fencing tokens prevent it.
What can asynchronous replication lose? :: Writes the leader acknowledged but had not yet copied to a follower before it failed over.`;
let notes;try{notes=localStorage.fcNotes}catch(e){}notes=notes||SAMPLE;
const parse=t=>t.split('\n').map(l=>l.split('::')).filter(p=>p.length===2&&p[0].trim()&&p[1].trim()).map(([q,a])=>({q:q.trim(),a:a.trim()}));
let deck=parse(notes),tab='Study',queue=[],cur=null,shown=false,seen=0,missed=0;
const T={Study:study,Quiz:quiz,Build:build};
function setTab(t){tab=t;tabs.innerHTML=Object.keys(T).map(k=>`<button class="${k===tab?'on':''}" onclick="setTab('${k}')">${k}</button>`).join('')+` <small>${deck.length} cards: Distributed Systems</small>`;T[t]()}
function study(){if(!queue.length){queue=deck.map((_,i)=>i).sort(()=>Math.random()-.5);seen=0;missed=0}cur=queue[0];shown=false;drawStudy()}
function drawStudy(){const c=deck[cur];view.innerHTML=`<div class="card flash" onclick="shown=!shown;drawStudy()">${shown?c.a:c.q}</div><p style="text-align:center"><small>Click the card to flip. ${queue.length} left in this round, ${missed} missed so far.</small></p>
<p style="text-align:center"><button class="btn" onclick="grade(false)">Missed it</button><button class="btn p" onclick="grade(true)">Got it</button></p>`}
function grade(ok){queue.shift();seen++;if(!ok){missed++;queue.splice(Math.min(3,queue.length),0,cur)} // missed cards come back 3 cards later
 if(!queue.length){view.innerHTML=`<div class="card"><h2>Round done</h2><p>${seen} reviews, ${missed} misses. Every card you missed came back until you got it.</p><button class="btn p" onclick="study()">New round</button></div>`;return}cur=queue[0];shown=false;drawStudy()}
let qi=0,score=0,order=[];
function quiz(){order=deck.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,Math.min(8,deck.length));qi=0;score=0;drawQuiz()}
function drawQuiz(){if(qi>=order.length){view.innerHTML=`<div class="card"><h2>Score: ${score}/${order.length}</h2><button class="btn p" onclick="quiz()">Try again</button></div>`;return}
 const k=order[qi],wrong=deck.map((_,i)=>i).filter(i=>i!==k).sort(()=>Math.random()-.5).slice(0,3),opts=[k,...wrong].sort(()=>Math.random()-.5);
 view.innerHTML=`<div class="card"><small>Question ${qi+1} of ${order.length}</small><h3>${deck[k].q}</h3>${opts.map(o=>`<button class="btn opt" data-o="${o}" onclick="answer(this,${o},${k})">${deck[o].a}</button>`).join('')}</div>`}
function answer(b,o,k){document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.o===k)x.classList.add('ok')});if(o===k)score++;else b.classList.add('bad');setTimeout(()=>{qi++;drawQuiz()},1100)}
function build(){view.innerHTML=`<div class="card"><p>Paste your notes, one card per line: <code>question :: answer</code>. Check every answer against your notes before you study it.</p><textarea id="ta">${notes.replace(/</g,'&lt;')}</textarea>
<button class="btn p" onclick="save()">Save deck</button><button class="btn" onclick="ta.value=SAMPLE">Reset to sample</button> <small id="msg"></small></div>`}
function save(){const d=parse(ta.value);if(!d.length){msg.textContent='No cards found. Use "question :: answer".';return}notes=ta.value;deck=d;queue=[];try{localStorage.fcNotes=notes}catch(e){}msg.textContent=`Saved ${d.length} cards.`}
console.assert(parse('a :: b\nno sep\n :: x').length===1,'parser');setTab('Study');
</script></body></html>
